name: Android CI & Automatic Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Decode Debug Keystore (if present)
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 --decode debug.keystore.base64 > debug.keystore || base64 -d debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore"
          fi

      - name: Run assembleDebug
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Financial_Reports_App_Debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create or Update GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: Financial Reports Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          allowUpdates: true
          body: |
            🚀 **Financial Reports HZdotCOM Android App Build**
            
            Aplikasi Laporan Keuangan Native Android (Kotlin + Jetpack Compose)
            - 📊 Laporan Keuangan & Ekspor PDF
            - 📱 Direct Social Media & WhatsApp Sharing
            - 🌙 Mode Gelap (Dark Mode)
            
            Silakan unduh file `Financial_Reports_App_Debug.apk` yang terlampir di bawah dan install di perangkat Android Anda.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
