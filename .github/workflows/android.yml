name: Android CI & Automatic Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Decode Debug Keystore (if present)
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 --decode debug.keystore.base64 > debug.keystore || base64 -d debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore"
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-configuration-cache --stacktrace

      - name: Locate Generated APK
        id: locate_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "Found APK at: $APK_PATH"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Financial_Reports_App_Debug.apk
          path: ${{ env.APK_PATH }}

      - name: Create GitHub Release (On Tag Push or Main Branch)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          name: Financial Reports Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          body: |
            🚀 **Financial Reports HZdotCOM Android App Build**
            
            Aplikasi Laporan Keuangan Native Android (Kotlin + Jetpack Compose)
            - 📊 Laporan Keuangan & Ekspor PDF
            - 📱 Direct Social Media & WhatsApp Sharing
            - 🌙 Mode Gelap (Dark Mode)
            
            Silakan unduh file `.apk` yang terlampir di bawah dan install di perangkat Android Anda.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
